<ui-card>
  <div class="ui-profile-card">
    <img class="ui-profile-card__image" [src]="imageFailed() ? fallbackSrc() : imageSrc()" (error)="imageFailed.set(true)" alt="" />
    <div class="ui-profile-card__content">
      <h3 class="ui-profile-card__name">{{ name() }}</h3>
      @if (subtitle()) {
        <p class="ui-profile-card__subtitle">{{ subtitle() }}</p>
      }
      <div class="ui-profile-card__text">
        <ng-content />
      </div>
    </div>
  </div>
</ui-card>
