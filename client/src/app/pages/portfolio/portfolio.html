@if (user(); as user) {
<div class="app-layout">
  <ui-sidebar [items]="sections" [(open)]="menuOpen" />

  <div class="app-content">
    <header class="app-header">
      <button
        type="button"
        class="app-menu-button"
        aria-label="Abrir menú"
        [attr.aria-expanded]="menuOpen()"
        (click)="menuOpen.set(true)"
      >
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <span class="app-header__brand">{{ user.fullName }}</span>
      <a class="app-header__switch" routerLink="/">Cambiar usuario</a>
      <ui-theme-toggle />
    </header>

    <main class="app-main">
      <section id="inicio" class="app-section">
        <ui-profile-card imageSrc="avatar-placeholder.svg" [name]="user.fullName" [subtitle]="user.headline ?? user.companies.join(', ')">
          {{ user.email }}
        </ui-profile-card>
      </section>

      <section id="sobre-mi" class="app-section">
        <ui-section-header heading="Sobre mí" />
        <p>Contenido pendiente.</p>
      </section>

      <section id="experiencia" class="app-section">
        <ui-section-header heading="Experiencia" />
        <p>Contenido pendiente.</p>
      </section>

      <section id="componentes" class="app-section">
        <ui-section-header heading="Componentes UI" subtitle="Vista previa de shared/ui en modo claro y oscuro." />

        <div class="app-grid">
          <ui-card heading="Tags">
            <div class="app-row">
              <ui-tag>Angular</ui-tag>
              <ui-tag>TypeScript</ui-tag>
              <ui-tag>SCSS</ui-tag>
            </div>
          </ui-card>

          <ui-card heading="Botones y enlaces">
            <div class="app-row">
              <ui-button>Primary</ui-button>
              <ui-button variant="secondary">Secondary</ui-button>
              <ui-button variant="ghost">Ghost</ui-button>
            </div>
            <ui-link href="https://angular.dev" [external]="true">Enlace externo</ui-link>
          </ui-card>

          <ui-card heading="Progress bars">
            <div class="app-stack">
              <ui-progress-bar label="Frontend" [value]="90" />
              <ui-progress-bar label="Backend" [value]="75" />
            </div>
          </ui-card>
        </div>
      </section>

      <section id="contacto" class="app-section">
        <ui-section-header heading="Contacto" />
        <p>Contenido pendiente.</p>
      </section>
    </main>
  </div>
</div>
}
