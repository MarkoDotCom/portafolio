<header class="shell__header">
  <a class="shell__brand" [routerLink]="home()">Portafolio</a>

  <nav class="shell__nav" aria-label="Secciones de la app">
    @if (isWorker()) {
      <a class="shell__link" routerLink="/ofertas" routerLinkActive="shell__link--active">Ofertas</a>
      <a class="shell__link" routerLink="/postulaciones" routerLinkActive="shell__link--active">Mis postulaciones</a>
    }
    @if (isEmployer()) {
      <a class="shell__link" routerLink="/empresa/ofertas" routerLinkActive="shell__link--active">Ofertas de mi empresa</a>
    }
    <a class="shell__link" routerLink="/portafolio" routerLinkActive="shell__link--active">Mi portafolio</a>
  </nav>

  <span class="shell__user">{{ user()?.fullName }}</span>
  <a class="shell__link" routerLink="/" (click)="session.clear()">Cambiar usuario</a>
  <ui-theme-toggle />
</header>

<router-outlet />
